name: Metrics
on:
  # Schedule daily updates
  schedule: [{cron: "0 0 * * *"}]
  # (optional) Run workflow manually
  workflow_dispatch:
  # (optional) Run workflow when pushing on master/main
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@master
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          base: header
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_limit: 6
          plugin_languages_details: percentage
          plugin_notable: yes
          plugin_notable_indepth: yes
          plugin_notable_repositories: yes
          plugin_notable_from: all
          plugin_notable_self: yes
          config_timezone: Asia/Hong_Kong
          config_order: base.header, isocalendar, notable, languages

  update-organizations:
    needs: github-metrics
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update organizations in README
        env:
          # Optional: set the repository variable to true only if you want
          # private organization memberships published on your profile.
          INCLUDE_PRIVATE_ORGS: ${{ vars.INCLUDE_PRIVATE_ORGS }}
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: python3 .github/scripts/update_organizations.py
      - name: Commit README if changed
        run: |
          if git diff --quiet -- README.md; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Refresh profile organization memberships [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
